[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 1. Global Security Headers (Applies to everything)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Let Netlify handle standard HTML/asset caching smartly by default
    Cache-Control = "public, max-age=0, must-revalidate"

# 2. Aggressive Caching for Vite Assets (Safe for compiled files)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
